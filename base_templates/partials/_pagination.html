{% if page_obj %}
    <div class="pagination">
        <span class="step-links">
            {% if page_obj.has_previous %}
                <a href="?page=1&q={{ valor_pesquisa }}">&laquo; first</a>
                <a href="?page={{ page_obj.previous_page_number }}&q={{ valor_pesquisa }}">previous</a>
            {% endif %}

            <span class="current">
                Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}.
            </span>

            {% if page_obj.has_next %}
                <a href="?page={{ page_obj.next_page_number }}&q={{ valor_pesquisa }}">next</a>
                <a href="?page={{ page_obj.paginator.num_pages }}&q={{ valor_pesquisa }}">last &raquo;</a>
            {% endif %}
        </span>
    </div>
{% endif %}

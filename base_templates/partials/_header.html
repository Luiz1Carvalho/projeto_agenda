    <header class="header">
        <a href="{% url 'contact:index' %}" class="header-link">
            <h1 class="header-heading">Agenda</h1>
        </a>
        
        <nav class="menu">
            <ul class="menu-list">
                {% if user.is_authenticated %}
                    <li class="menu-item"><a href="{% url 'contact:index' %}" class="menu-link">Home</a></li>
                    <li class="menu-item"><a href="{% url 'contact:user_update' %}" class="menu-link">Perfil</a></li>
                    <li class="menu-item"><a href="{% url 'contact:create' %}" class="menu-link">Criar Contato</a></li>
                    <li class="menu-item"><a href="{% url 'contact:logout' %}" class="menu-link">Sair</a></li>
                    {% else %}
                    <li class="menu-item"><a href="{% url 'contact:login' %}" class="menu-link">Login</a></li>
                    <li class="menu-item"><a href="{% url 'contact:register' %}" class="menu-link">Registrar</a></li>
                {% endif %}

            </ul>
        </nav>
        <div class="search">
            <form action="{% url 'contact:search' %}" method="get">
                <input 
                type="search" 
                class="search-input" 
                placeholder="Search"
                id="search"
                name="q"
                value = "{{ valor_pesquisa }}"
                >
            </form>
        </div>
    </header>
